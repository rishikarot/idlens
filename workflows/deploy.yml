name: Publish ID Lens (offline assets)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and bundle models locally
        run: bash scripts/fetch_assets.sh
      - name: Verify all libraries and model weights
        run: python3 scripts/verify_assets.py
      - name: Assemble deployable static site
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html app.js sw.js manifest.webmanifest asset-manifest.json dist/
          touch dist/.nojekyll
          cp -R assets updates samples dist/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload completed offline site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
